<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>活字排版工坊</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">本地活字印章排版</p>
          <h1>活字排版工坊</h1>
        </div>
        <div class="top-actions">
          <button id="saveDraftBtn" class="primary">保存草稿</button>
          <button id="exportBtn">导出预览图</button>
          <button id="clearBoardBtn">清空版面</button>
        </div>
      </header>

      <section class="settings-bar" aria-label="版面设置">
        <label>
          纸张
          <select id="paperSize">
            <option value="postcard">明信片</option>
            <option value="bookmark">书签</option>
            <option value="square">方形小笺</option>
          </select>
        </label>
        <label>
          方向
          <select id="flowMode">
            <option value="horizontal">横排</option>
            <option value="vertical">竖排</option>
          </select>
        </label>
        <label>
          网格
          <input id="gridGap" type="range" min="4" max="18" value="8" />
        </label>
        <label>
          作品名
          <input id="workTitle" type="text" placeholder="例：晚风小笺" />
        </label>
      </section>

      <section class="workspace">
        <aside class="panel inventory-panel">
          <div class="panel-head">
            <h2>字模库</h2>
            <span id="inventoryCount"></span>
          </div>
          <form id="typeForm" class="type-form">
            <input id="charInput" maxlength="2" placeholder="字" required />
            <input id="styleInput" placeholder="风格" required />
            <input id="sizeInput" type="number" min="8" max="72" value="24" required />
            <input id="quantityInput" type="number" min="1" max="99" value="3" required />
            <select id="wearInput">
              <option value="新">新</option>
              <option value="微磨">微磨</option>
              <option value="旧痕">旧痕</option>
            </select>
            <input id="cabinetInput" type="number" min="1" placeholder="柜号" />
            <input id="layerInput" type="number" min="1" placeholder="层号" />
            <input id="cellInput" type="number" min="1" placeholder="格号" />
            <span class="form-hint">柜/层/格可留空，留空则留库待补录；同一位置合计不超过3枚。</span>
            <button class="primary" type="submit">加入字模</button>
          </form>
          <div class="filter-row">
            <input id="inventorySearch" type="search" placeholder="搜索字或风格" />
            <select id="styleFilter">
              <option value="all">全部风格</option>
            </select>
            <select id="locationFilter">
              <option value="all">全部库位</option>
              <option value="pending">待补录</option>
              <option value="over">超容</option>
            </select>
          </div>
          <div id="typeList" class="type-list"></div>
        </aside>

        <section class="stage-wrap">
          <div class="status-strip">
            <div>
              <strong id="selectedTypeLabel">未选择字模</strong>
              <span id="selectedHint">点击字模后，在版面格子中落字，也可拖拽字模到版面。</span>
            </div>
            <div id="shortageBadge" class="badge ok">数量充足</div>
          </div>
          <p id="actionNotice" class="notice" hidden></p>
          <div id="stage" class="stage" aria-label="排版画布"></div>
        </section>

        <aside class="panel side-panel">
          <div class="panel-head">
            <h2>取字与台账</h2>
            <span id="placedCount"></span>
          </div>
          <div class="tab-row" role="tablist" aria-label="取字与台账">
            <button type="button" class="tab active" data-tab="pick">取字单</button>
            <button type="button" class="tab" data-tab="ledger">库位台账</button>
            <button type="button" class="tab" data-tab="drafts">草稿<span id="draftCount"></span></button>
          </div>
          <section id="pickPanel" class="tab-panel">
            <div id="pickSummary" class="panel-sub"></div>
            <div id="pickList" class="pick-list"></div>
          </section>
          <section id="ledgerPanel" class="tab-panel" hidden>
            <div id="ledgerList" class="ledger-list"></div>
          </section>
          <section id="draftsPanel" class="tab-panel" hidden>
            <div id="draftList" class="draft-list"></div>
          </section>
        </aside>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
